[project]
name = "land-ocr-api"
version = "0.1.0"
description = "Backend OCR and structured extraction for land-acquisition documents"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=11,<12",
  "pydantic>=2.10,<3",
  "pypdfium2>=4.30,<5",
  "python-multipart>=0.0.18,<1",
  "torch>=2.4,<3",
  "transformers>=4.49,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
